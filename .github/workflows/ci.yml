name: Luma CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run Tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pytest tests/ -v --tb=short
          
      - name: Notify Telegram on CI Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="❌ *Luma CI Failed (Test)*%0A"
          MESSAGE+="📦 Repo: \`${{ github.repository }}\`%0A"
          MESSAGE+="🌿 Branch: \`${{ github.ref_name }}\`%0A"
          MESSAGE+="👤 Author: ${{ github.actor }}%0A"
          MESSAGE+="📝 Commit: \`${{ github.event.head_commit.message || github.event.pull_request.title }}\`%0A"
          MESSAGE+="🔗 [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}"
          
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Linting Tools
        run: pip install ruff
        
      - name: Run Ruff Linter
        run: ruff check . --ignore E501,F401

      - name: Notify Telegram on CI Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="❌ *Luma CI Failed (Lint)*%0A"
          MESSAGE+="📦 Repo: \`${{ github.repository }}\`%0A"
          MESSAGE+="🌿 Branch: \`${{ github.ref_name }}\`%0A"
          MESSAGE+="👤 Author: ${{ github.actor }}%0A"
          MESSAGE+="📝 Commit: \`${{ github.event.head_commit.message || github.event.pull_request.title }}\`%0A"
          MESSAGE+="🔗 [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}"
