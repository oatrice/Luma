name: Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v

    - name: Notify Telegram on success
      if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      continue-on-error: true
      run: |
        MESSAGE="✅ *Luma CI Succeeded (Test)*%0A"
        MESSAGE+="📦 Repo: \`${{ github.repository }}\`%0A"
        MESSAGE+="🌿 Branch: \`${{ github.ref_name }}\`%0A"
        MESSAGE+="👤 Author: ${{ github.actor }}%0A"
        MESSAGE+="📝 Commit: \`${{ github.event.head_commit.message || github.event.pull_request.title }}\`%0A"
        MESSAGE+="🔗 [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="${MESSAGE}"

    - name: Notify Telegram on failure
      if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      continue-on-error: true
      run: |
        MESSAGE="❌ *Luma CI Failed (Test)*%0A"
        MESSAGE+="📦 Repo: \`${{ github.repository }}\`%0A"
        MESSAGE+="🌿 Branch: \`${{ github.ref_name }}\`%0A"
        MESSAGE+="👤 Author: ${{ github.actor }}%0A"
        MESSAGE+="📝 Commit: \`${{ github.event.head_commit.message || github.event.pull_request.title }}\`%0A"
        MESSAGE+="🔗 [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="${MESSAGE}"

  lint:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter
      run: |
        ruff check . --ignore E501,F401

    - name: Notify Telegram on failure
      if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      continue-on-error: true
      run: |
        MESSAGE="❌ *Luma CI Failed (Lint)*%0A"
        MESSAGE+="📦 Repo: \`${{ github.repository }}\`%0A"
        MESSAGE+="🌿 Branch: \`${{ github.ref_name }}\`%0A"
        MESSAGE+="👤 Author: ${{ github.actor }}%0A"
        MESSAGE+="📝 Commit: \`${{ github.event.head_commit.message || github.event.pull_request.title }}\`%0A"
        MESSAGE+="🔗 [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="${MESSAGE}"
