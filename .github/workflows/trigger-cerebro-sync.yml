name: Trigger Cerebro Sync

on:
  # ดักฟังการเปลี่ยนแปลง Issue และ PR (Project V2 ไม่มี native trigger)
  issues:
    types: [opened, reopened, labeled, unlabeled, edited, closed]
  pull_request:
    types: [opened, reopened, closed, labeled, edited]
  # Schedule fallback สำหรับ Project changes ที่ไม่มี event
  schedule:
    - cron: '0 */4 * * *'  # ทุก 4 ชั่วโมง

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cerebro Sync Engine
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PROJECTS_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/oatrice/Cerebro/actions/workflows/sync-project-statuses.yml/dispatches \
            -d '{"ref":"main", "inputs": {"reason": "Project Item Change in '${{ github.repository }}'"}}'
